# Ultrecon tool manifest -- single source of truth.
#
# installer.py installs from this file; docs/MODULES.md is generated from it.
# access:
#   oss          fully free / open source
#   free_tier    free but an optional API key/tier may be needed (off by default
#                unless the key is configured)
#   manual_only  useful reference, not wired into automated phases
# install_method: go | pipx | npm | gem | git | apt_fallback | manual_note
# kind: tool | http_api | wordlist | os_utility
#
# No paid-only platforms are wired in. Shodan/Censys appear only as optional
# free-credit references and are off by default; their API is not called.
version: 1
updated: "2026-10-23"
tools:
  # =====================================================================
  # Phase 1 -- passive OSINT & org recon
  # =====================================================================
  theharvester:
    name: theHarvester
    phase: 1
    description: Multi-source OSINT harvester (emails, hosts, employee names).
    binary: theHarvester
    check_cmd: "theHarvester -h"
    version_cmd: null
    install_method: pipx
    pipx_package: theHarvester
    repo_url: https://github.com/laramies/theHarvester
    access: oss
    kind: tool
  recon-ng:
    name: Recon-ng
    phase: 1
    description: Modular OSINT framework with free modules.
    binary: recon-ng
    check_cmd: "recon-ng -h"
    version_cmd: null
    install_method: pipx
    pipx_package: recon-ng
    repo_url: https://github.com/lanmaster53/recon-ng
    access: oss
    kind: tool
  spiderfoot:
    name: SpiderFoot (OSS edition)
    phase: 1
    description: OSINT automation with a large free module set.
    binary: sf.py
    check_cmd: "sf.py -h"
    version_cmd: null
    install_method: git
    git_url: https://github.com/smicallef/spiderfoot
    build: pip
    binary_path: sf.py
    repo_url: https://github.com/smicallef/spiderfoot
    access: oss
    kind: tool
    notes: Large Python app; auto-install is disabled by default in config.
  sn0int:
    name: sn0int
    phase: 1
    description: Semi-automatic OSINT framework and package manager.
    binary: sn0int
    check_cmd: "sn0int --version"
    version_cmd: "sn0int --version"
    install_method: apt_fallback
    apt_package: sn0int
    repo_url: https://github.com/kpcyrd/sn0int
    access: oss
    kind: tool
    notes: Not available in every distro; falls back to a manual cargo/git install note.
  whois:
    name: whois
    phase: 1
    description: WHOIS registration and org metadata.
    binary: whois
    check_cmd: "whois --version"
    version_cmd: "whois --version"
    install_method: apt_fallback
    apt_package: whois
    repo_url: https://github.com/rfc1036/whois
    access: oss
    kind: os_utility
  dig:
    name: dig (BIND)
    phase: 1
    description: DNS lookups, CNAME/NS/MX records and zone metadata.
    binary: dig
    check_cmd: "dig -v"
    version_cmd: "dig -v"
    install_method: apt_fallback
    apt_package: dnsutils
    repo_url: https://bind9.readthedocs.io/
    access: oss
    kind: os_utility
  host:
